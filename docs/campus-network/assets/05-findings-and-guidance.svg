<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Arial",sans-serif}</style><rect width="1600" height="900" fill="#f7fbff"/><rect width="1600" height="98" fill="#123459"/><text x="55" y="62" font-size="39" font-weight="750" fill="#fff" text-anchor="start">校园网络系列图 5/5 · 实测结论与使用建议</text><text x="1545" y="60" font-size="18" font-weight="500" fill="#dbeafe" text-anchor="end">证据链 / 边界 / 应用</text><rect x="75" y="130" width="700" height="246" rx="13" fill="#eaf8f0" stroke="#16865c" stroke-width="2"/><text x="95" y="164" font-size="25" font-weight="700" fill="#16865c" text-anchor="start">已实测确认</text><text x="95" y="199" font-size="20" font-weight="450" fill="#1c334b" text-anchor="start">学生网跨接入点、跨区域、跨账号互通</text><text x="95" y="229" font-size="20" font-weight="450" fill="#1c334b" text-anchor="start">TCP 47890、HTTP 及 FileBridge 同步成功</text><text x="95" y="259" font-size="20" font-weight="450" fill="#1c334b" text-anchor="start">教学网 → 学生网路由观测到两跳</text><text x="95" y="289" font-size="20" font-weight="450" fill="#1c334b" text-anchor="start">学生网与教学网指定 TCP 连接双向失败</text><rect x="825" y="130" width="700" height="246" rx="13" fill="#fff6e6" stroke="#a46b1d" stroke-width="2"/><text x="845" y="164" font-size="25" font-weight="700" fill="#a46b1d" text-anchor="start">仍属于推断</text><text x="845" y="199" font-size="20" font-weight="450" fill="#1c334b" text-anchor="start">跨区限制可能由 ACL / 防火墙实现</text><text x="845" y="229" font-size="20" font-weight="450" fill="#1c334b" text-anchor="start">网关可能使用 VRRP 或代理 ARP</text><text x="845" y="259" font-size="20" font-weight="450" fill="#1c334b" text-anchor="start">核心跳点不等于已确定核心设备身份</text><text x="845" y="289" font-size="20" font-weight="450" fill="#1c334b" text-anchor="start">仿真 VLAN、路由器及接口均非实测</text><rect x="75" y="415" width="1450" height="195" rx="17" fill="#fff" stroke="#cad8e6" stroke-width="2"/><text x="120" y="467" font-size="30" font-weight="750" fill="#123459" text-anchor="start">排障过程</text><rect x="115" y="495" width="275" height="34" rx="17" fill="#eaf8f0" stroke="none" stroke-width="0"/><text x="252.5" y="520" font-size="17" font-weight="650" fill="#16865c" text-anchor="middle">同账号学生网成功</text><rect x="455" y="495" width="290" height="34" rx="17" fill="#eaf8f0" stroke="none" stroke-width="0"/><text x="600" y="520" font-size="17" font-weight="650" fill="#16865c" text-anchor="middle">不同账号学生网成功</text><rect x="810" y="495" width="285" height="34" rx="17" fill="#fff0ef" stroke="none" stroke-width="0"/><text x="952.5" y="520" font-size="17" font-weight="650" fill="#c64747" text-anchor="middle">学生 / 教学互测失败</text><rect x="1160" y="495" width="300" height="34" rx="17" fill="#fff6e6" stroke="none" stroke-width="0"/><text x="1310" y="520" font-size="17" font-weight="650" fill="#a46b1d" text-anchor="middle">疑似区域访问控制</text><line x1="393" y1="512" x2="450" y2="512" stroke="#2563a6" stroke-width="3" stroke-linecap="round" /><line x1="749" y1="512" x2="805" y2="512" stroke="#2563a6" stroke-width="3" stroke-linecap="round" /><line x1="1100" y1="512" x2="1155" y2="512" stroke="#2563a6" stroke-width="3" stroke-linecap="round" /><rect x="75" y="640" width="1450" height="174" rx="17" fill="#eaf4fe" stroke="#2563a6" stroke-width="2"/><text x="120" y="693" font-size="30" font-weight="750" fill="#2563a6" text-anchor="start">对 FileBridge 的影响</text><text x="120" y="740" font-size="24" font-weight="500" fill="#1c334b" text-anchor="start">两端处于已验证的学生网络范围：可以直接使用 HTTP/TCP 文件同步。</text><text x="120" y="779" font-size="23" font-weight="500" fill="#1c334b" text-anchor="start">跨学生网与教学网：当前测试中直连失败；具体策略及替代路径应由网络管理方确认。</text><rect x="0" y="860" width="1600" height="40" fill="#e8eff7"/><text x="55" y="886" font-size="19" font-weight="500" fill="#577087" text-anchor="start">FileBridge · 校园网络实验案例｜实测与推断分离｜非学校官方网络拓扑</text></svg>