ll="#1c334b" text-anchor="start">Windows → Mac Ping 成功；Mac → Windows Ping 失败，但 TCP/HTTP 成功。</text><text x="150" y="810" font-size="22" font-weight="700" fill="#2563a6" text-anchor="start">网络机制线索：</text><text x="335" y="810" font-size="21" font-weight="500" fill="#577087" text-anchor="start">第一跳 10.252.0.1；ARP 曾出现 00:00:5e:00:01:01（疑似 VRRP / 代理 ARP）。</text><rect x="0" y="860" width="1600" height="40" fill="#e8eff7"/><text x="55" y="886" font-size="19" font-weight="500" fill="#577087" text-anchor="start">FileBridge · 校园网络实验案例｜实测与推断分离｜非学校官方网络拓扑</text></svg>